name: Manager
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "README.md", "CHANGELOG.md"]
  pull_request:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
    secrets:
      KILASU_KEYSTORE_BASE64:
        required: false
      KILASU_STORE_PASSWORD:
        required: false
      KILASU_KEY_PASSWORD:
        required: false
      KILASU_KEY_ALIAS:
        required: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Android toolchain
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Debug build and checks
        working-directory: manager
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug
      - name: Release signing and build
        if: inputs.release
        working-directory: manager
        env:
          KEYSTORE_BASE64: ${{ secrets.KILASU_KEYSTORE_BASE64 }}
          KILASU_STORE_PASSWORD: ${{ secrets.KILASU_STORE_PASSWORD }}
          KILASU_KEY_PASSWORD: ${{ secrets.KILASU_KEY_PASSWORD }}
          KILASU_KEY_ALIAS: ${{ secrets.KILASU_KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$KILASU_STORE_PASSWORD" && test -n "$KILASU_KEY_ALIAS"
          export KILASU_KEYSTORE="$RUNNER_TEMP/kilasu.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KILASU_KEYSTORE"
          chmod 600 "$KILASU_KEYSTORE"
          ./gradlew --no-daemon assembleRelease
          rm -f "$KILASU_KEYSTORE"
      - uses: actions/upload-artifact@v4
        with:
          name: manager-debug
          path: manager/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: inputs.release
        with:
          name: manager-release
          path: manager/app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manager-reports
          path: manager/app/build/reports
  screenshot:
    if: '!inputs.release'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-35' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            cd manager && ./gradlew --no-daemon -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true connectedDebugAndroidTest
            adb pull /sdcard/Android/data/io.github.kilasu.manager/files/manager-home.png manager-home.png
      - uses: actions/upload-artifact@v4
        with:
          name: manager-screenshot
          path: manager-home.png
  development-packages:
    needs: [build, screenshot]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !inputs.release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: manager-debug
          path: artifacts/manager
      - name: Verify same-commit builds and package development outputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci_package.py
      - uses: actions/upload-artifact@v4
        with:
          name: kilasu-development-packages
          path: dist/
