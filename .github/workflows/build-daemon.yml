name: Daemon
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "README.md", "CHANGELOG.md"]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.75.0'
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: python3 -m unittest discover -s tests -v
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.75.0'
          targets: aarch64-linux-android
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'ndk;27.2.12479018'
      - name: Build Android daemon and CLI
        run: |
          compiler="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$compiler/aarch64-linux-android31-clang"
          export AR_aarch64_linux_android="$compiler/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$CC_aarch64_linux_android"
          cargo build --locked --release --target aarch64-linux-android
      - uses: actions/upload-artifact@v4
        with:
          name: daemon-arm64
          path: |
            target/aarch64-linux-android/release/kilasd
            target/aarch64-linux-android/release/kila
