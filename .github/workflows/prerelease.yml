name: Prerelease
on:
  push:
    branches: [main]
    paths: [".github/prerelease.json"]
permissions:
  contents: read
  actions: read
concurrency:
  group: kilasu-prerelease
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify source-matched builds and publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/publish_prerelease.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kilasu-prerelease-packages
          path: dist/prerelease/
          if-no-files-found: ignore
