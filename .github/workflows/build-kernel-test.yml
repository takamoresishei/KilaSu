name: Kernel
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  ack:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        branch: [android12-5.10, android13-5.15, android14-6.1]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang-14 lld-14 llvm-14 flex bison libelf-dev gcc-aarch64-linux-gnu
      - name: Fetch only selected ACK family
        run: git clone --depth 1 --single-branch --branch '${{ matrix.branch }}' https://github.com/aosp-mirror/kernel_common.git ack
      - run: ./scripts/integrate.sh "$PWD/ack"
      - name: Compile built-in core and enforcing adapter
        run: |
          export PATH="/usr/lib/llvm-14/bin:$PATH"
          make -C ack O="$PWD/ack-out" ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- gki_defconfig
          ack/scripts/config --file ack-out/.config --enable SECURITY --enable SECURITY_SELINUX --enable KILASU --enable KILASU_SELINUX_INTERNAL
          make -C ack O="$PWD/ack-out" ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          grep -q "^CONFIG_KILASU=y$" ack-out/.config
          grep -q "^CONFIG_KILASU_SELINUX_INTERNAL=y$" ack-out/.config
          make -C ack O="$PWD/ack-out" ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- -j2 drivers/kilasu/kernel/
          test -s ack-out/drivers/kilasu/kernel/core/kila_core.o
      - uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.branch }}
          path: |
            ack-out/drivers/kilasu/kernel/**/*.o
            ack-out/.config
